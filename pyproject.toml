[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ammoire"
version = "0.1.0"
description = "Tight-binding and moire diagnostics for altermagnets and hyperspin models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
ammoire = "ammoire.__main__:main"

[tool.setuptools]
packages = ["ammoire"]
